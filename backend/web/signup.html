<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RewardsHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .signup-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .password-requirements {
            background-color: #f5f5f5;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .password-requirements ul {
            margin: 8px 0 0 20px;
            padding: 0;
        }

        .password-requirements li {
            margin: 4px 0;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
        }

        .requirement-item.met {
            color: #3c3;
        }

        .requirement-item.unmet {
            color: #999;
        }

        .requirement-check {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            border-radius: 3px;
        }

        .requirement-item.met .requirement-check {
            background-color: #3c3;
            color: white;
        }

        .requirement-item.unmet .requirement-check {
            background-color: #ddd;
            color: #999;
        }

        .terms-agreement {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .terms-agreement input[type="checkbox"] {
            margin-right: 8px;
            margin-top: 3px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .terms-agreement label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            color: #666;
            line-height: 1.4;
        }

        .terms-agreement a {
            color: #667eea;
            text-decoration: none;
        }

        .terms-agreement a:hover {
            text-decoration: underline;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .signup-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .signup-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
            animation: shake 0.3s ease-in-out;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #3c3;
        }

        .success-message.show {
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #764ba2;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .signup-box {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-row .form-group {
                margin-bottom: 20px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="tel"] {
                padding: 10px 12px;
            }

            .signup-btn {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="signup-box">
            <div class="logo">
                <h1>RewardsHub</h1>
                <p>Create your account</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="John" required
                            autocomplete="given-name">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Doe" required
                            autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000"
                        autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>

                <div class="password-requirements" id="passwordRequirements">
                    <strong>Password requirements:</strong>
                    <div class="requirement-item unmet" id="minLength">
                        <span class="requirement-check">✓</span>
                        At least 8 characters
                    </div>
                    <div class="requirement-item unmet" id="hasUppercase">
                        <span class="requirement-check">✓</span>
                        One uppercase letter (A-Z)
                    </div>
                    <div class="requirement-item unmet" id="hasNumber">
                        <span class="requirement-check">✓</span>
                        One number (0-9)
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>

                <div class="terms-agreement">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label for="agreeTerms">
                        I agree to the <a href="#terms" target="_blank">Terms of Service</a> and <a href="#privacy"
                            target="_blank">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="signup-btn" id="signupBtn">
                    <span class="btn-content">Create Account</span>
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="/login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const agreeTermsCheckbox = document.getElementById('agreeTerms');
        const signupBtn = document.getElementById('signupBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Password requirement checkers
        const minLengthReq = document.getElementById('minLength');
        const hasUppercaseReq = document.getElementById('hasUppercase');
        const hasNumberReq = document.getElementById('hasNumber');

        // Password validation functions
        function checkMinLength(password) {
            return password.length >= 8;
        }

        function checkUppercase(password) {
            return /[A-Z]/.test(password);
        }

        function checkNumber(password) {
            return /[0-9]/.test(password);
        }

        function updatePasswordRequirements() {
            const password = passwordInput.value;

            // Update min length
            if (checkMinLength(password)) {
                minLengthReq.classList.remove('unmet');
                minLengthReq.classList.add('met');
            } else {
                minLengthReq.classList.remove('met');
                minLengthReq.classList.add('unmet');
            }

            // Update uppercase
            if (checkUppercase(password)) {
                hasUppercaseReq.classList.remove('unmet');
                hasUppercaseReq.classList.add('met');
            } else {
                hasUppercaseReq.classList.remove('met');
                hasUppercaseReq.classList.add('unmet');
            }

            // Update number
            if (checkNumber(password)) {
                hasNumberReq.classList.remove('unmet');
                hasNumberReq.classList.add('met');
            } else {
                hasNumberReq.classList.remove('met');
                hasNumberReq.classList.add('unmet');
            }
        }

        function validatePassword(password) {
            return checkMinLength(password) && checkUppercase(password) && checkNumber(password);
        }

        // Update requirements as user types
        passwordInput.addEventListener('input', updatePasswordRequirements);

        // Form submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            errorMessage.textContent = '';
            successMessage.textContent = '';

            // Get form values
            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate inputs
            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                showError('Please fill in all required fields');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }

            if (!validatePassword(password)) {
                showError('Password does not meet the requirements');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            if (!agreeTermsCheckbox.checked) {
                showError('You must agree to the Terms of Service and Privacy Policy');
                return;
            }

            // Disable button and show loading state
            signupBtn.disabled = true;
            const btnContent = signupBtn.querySelector('.btn-content');
            const originalContent = btnContent.innerHTML;
            btnContent.innerHTML = '<span class="loading"></span>Creating Account...';

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        first_name: firstName,
                        last_name: lastName,
                        phone: phone || '',
                        password: password,
                    }),
                    credentials: 'include',
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Sign up failed. Please try again.');
                    signupBtn.disabled = false;
                    btnContent.innerHTML = originalContent;
                    return;
                }

                // Show success message
                showSuccess('Account created successfully! Redirecting to login...');

                // Redirect to login page after a short delay
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);

            } catch (error) {
                console.error('Signup error:', error);
                showError('An error occurred. Please try again later.');
                signupBtn.disabled = false;
                btnContent.innerHTML = originalContent;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Clear error message when user starts typing
        [firstNameInput, lastNameInput, emailInput, phoneInput, passwordInput, confirmPasswordInput].forEach(input => {
            input.addEventListener('input', () => {
                if (errorMessage.classList.contains('show')) {
                    errorMessage.classList.remove('show');
                }
            });
        });

        // Allow Enter key to submit form
        confirmPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                signupForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>

</html>
